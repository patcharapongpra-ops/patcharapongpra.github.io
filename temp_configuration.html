<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Config AR5710-S / S5335 / ISR4331 Generator</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#101826;
      --panel2:#0f1722;
      --line:#243449;
      --text:#eaf2ff;
      --muted:#8fa4be;

      /* ORANGE theme */
      --accent:#ff7a18;
      --accent2:#ff9a3c;
      --accent-soft: rgba(255,122,24,.12);

      --ok:#37d67a;
      --warn:#ffd089;

      --radius-lg: 18px;
      --radius-md: 12px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(1100px 520px at 10% 0%, rgba(255,122,24,.18), transparent 55%),
        radial-gradient(900px 480px at 90% 20%, rgba(255,154,60,.10), transparent 55%),
        linear-gradient(180deg, #0b0f14, #070a0d);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }

    .container{
      width:100%;
      max-width:980px;
      border-radius:var(--radius-lg);
      border:1px solid rgba(36,52,73,.75);
      background: rgba(16,24,38,.60);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 55px rgba(0,0,0,.45), 0 0 0 1px rgba(148,163,184,.10);
      padding:22px 18px 18px;
    }
    @media (min-width:768px){
      .container{padding:26px 26px 22px}
    }

    .header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    .header-left{display:flex;flex-direction:column;gap:6px}
    .title{
      font-size:1.15rem;
      font-weight:900;
      letter-spacing:.02em;
      color:var(--text);
      display:flex;
      align-items:center;
      gap:10px;
    }
    .badgeP{
      width:34px;height:34px;border-radius:12px;
      display:grid;place-items:center;
      font-weight:1000;
      color:#1a0d05;
      background: linear-gradient(180deg, var(--accent), #d85f0f);
      box-shadow: 0 10px 30px rgba(255,122,24,.18);
    }
    .subtitle{font-size:.86rem;color:var(--muted);line-height:1.4}
    .pill{
      padding:6px 10px;
      border-radius:999px;
      font-size:.78rem;
      background: rgba(16,24,38,.55);
      color: var(--muted);
      border:1px solid rgba(36,52,73,.75);
      white-space:nowrap;
    }
    .pill strong{color:var(--text)}
    .pill.orange{
      border-color: rgba(255,122,24,.45);
      background: rgba(255,122,24,.10);
      color:#ffd7bf;
    }

    .section-title{
      font-size:.78rem;
      text-transform:uppercase;
      letter-spacing:.11em;
      color:var(--muted);
      margin:14px 0 6px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .dot{
      width:8px;height:8px;border-radius:999px;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(255,122,24,.10);
    }
    .line{
      border:none;
      border-top:1px dashed rgba(36,52,73,.85);
      margin:8px 0 12px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:10px 18px;
      margin-bottom:10px;
    }
    @media (min-width:760px){
      .form-grid{grid-template-columns:1fr 1fr}
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .field label{
      font-size:.82rem;
      font-weight:700;
      color:var(--muted);
    }
    .field input,.field select{
      padding:10px 10px;
      border-radius:var(--radius-md);
      border:1px solid rgba(36,52,73,.90);
      font-size:.92rem;
      outline:none;
      background: rgba(14,21,32,.95);
      color:var(--text);
      transition:border-color .15s, box-shadow .15s, background-color .15s;
    }
    .field input:focus,.field select:focus{
      border-color: rgba(255,122,24,.80);
      box-shadow: 0 0 0 3px rgba(255,122,24,.16);
      background: rgba(14,21,32,.98);
    }
    .field input::placeholder{color:#6f859d}

    .buttons{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:flex-end;
      margin:10px 0 12px;
    }
    button{
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(36,52,73,.90);
      font-size:.92rem;
      font-weight:900;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition:transform .08s, box-shadow .12s, background-color .12s, color .12s, border-color .12s;
      background: rgba(16,24,38,.55);
      color: var(--text);
    }
    button:active{transform:translateY(1px);box-shadow:none}
    .btn-primary{
      background: linear-gradient(180deg, rgba(255,122,24,.95), rgba(216,95,15,.95));
      border-color: rgba(255,122,24,.55);
      color:#1a0d05;
      box-shadow: 0 14px 30px rgba(255,122,24,.18);
    }
    .btn-primary:hover{filter:brightness(1.02)}
    .btn-ghost:hover{border-color: rgba(255,122,24,.45)}

    .output-wrapper{
      background: rgba(14,21,32,.95);
      border-radius:14px;
      padding:12px;
      border:1px solid rgba(36,52,73,.90);
    }
    .output-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
      gap:10px;
    }
    .output-title{
      font-size:.80rem;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.10em;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .output-status{
      font-size:.78rem;
      color:#ffd7bf;
      padding:5px 10px;
      border-radius:999px;
      border:1px solid rgba(255,122,24,.35);
      background: rgba(255,122,24,.10);
      white-space:nowrap;
    }
    pre#output{
      margin:0;
      background: transparent;
      color:#cfe3ff;
      font-size:.80rem;
      white-space:pre-wrap;
      word-wrap:break-word;
      max-height:420px;
      overflow-y:auto;
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      line-height:1.35;
    }

    .hint{
      font-size:.82rem;
      color:var(--muted);
      margin-top:6px;
      line-height:1.45;
    }
  </style>
</head>

<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="title">
        <div class="badgeP">P</div>
        Config Generator
      </div>
      <div class="subtitle">กรอกข้อมูลวงจร แล้วระบบจะสร้าง Config ให้พร้อมใช้งาน (Huawei / Cisco)</div>
      <div class="hint">* ปุ่ม “สร้าง Config” จะรวม <strong>PRECONFIG NODE</strong> + config เดิมให้ในผลลัพธ์</div>
    </div>
    <div class="pill orange"><strong>Provisioning</strong> · Jastel</div>
  </div>

  <div class="section-title"><span class="dot"></span>Device & ข้อมูลวงจร</div>
  <hr class="line"/>

  <div class="form-grid">
    <div class="field">
      <label for="deviceType">Device Type</label>
      <select id="deviceType">
        <option value="huawei-router">AR5710-S (Router)</option>
        <option value="huawei-switch">S5335-L10T4X-A-V2 (Switch)</option>
        <option value="cisco-4331">Cisco ISR4331 (Router)</option>
      </select>
    </div>

    <div class="field">
      <label for="Cxxx">CID</label>
      <input type="text" id="Cxxx" placeholder="เช่น C5324"/>
    </div>

    <div class="field">
      <label for="RT_Name">RT Name / Service Name</label>
      <input type="text" id="RT_Name" placeholder="เช่น China Mobile Getop"/>
    </div>

    <div class="field">
      <label for="VLAN">VLAN</label>
      <input type="text" id="VLAN" placeholder="เช่น 523"/>
    </div>

    <div class="field">
      <label for="LOOPBACK">Loopback / Loopback Switch</label>
      <input type="text" id="LOOPBACK" placeholder="เช่น 10.20.24.236"/>
    </div>
  </div>

  <div class="section-title"><span class="dot"></span>WAN Management</div>
  <hr class="line"/>

  <div class="form-grid">
    <div class="field">
      <label for="Name_main">Node MAIN (Node + Port)</label>
      <input type="text" id="Name_main" placeholder="เช่น CX600_BPO GE0/3/6"/>
    </div>

    <div class="field">
      <label for="Name_Protection">Node PROTEC (Node + Port)</label>
      <input type="text" id="Name_Protection" placeholder="เช่น CX600_BMM GE0/3/8"/>
    </div>

    <div class="field">
      <label for="WAN1_IP_NODE">WAN MGMT NODE MAIN</label>
      <input type="text" id="WAN1_IP_NODE" placeholder="เช่น 10.100.120.10/31"/>
    </div>

    <div class="field">
      <label for="WAN2_IP_NODE">WAN MGMT NODE PROTEC</label>
      <input type="text" id="WAN2_IP_NODE" placeholder="เช่น 10.100.103.104/31"/>
    </div>

    <div class="field">
      <label for="WAN1_IP_CustomerSUB1">WAN MGMT RT MAIN</label>
      <input type="text" id="WAN1_IP_CustomerSUB1" placeholder="เช่น 10.100.120.11/31"/>
    </div>

    <div class="field">
      <label for="WAN2_IP_CustomerSUB2">WAN MGMT RT PROTEC</label>
      <input type="text" id="WAN2_IP_CustomerSUB2" placeholder="เช่น 10.100.103.105/31"/>
    </div>
  </div>

  <div class="section-title"><span class="dot"></span>WAN / LAN</div>
  <hr class="line"/>

  <div class="form-grid">
    <div class="field">
      <label for="WAN_IP_Network">WAN Network</label>
      <input type="text" id="WAN_IP_Network" placeholder="เช่น 172.19.55.32/29"/>
    </div>

    <div class="field">
      <label for="LAN_IP_Network">LAN Network</label>
      <input type="text" id="LAN_IP_Network" placeholder="เช่น 203.156.1.168/30"/>
    </div>

    <div class="field">
      <label for="community_main">Community main</label>
      <input type="text" id="community_main" placeholder="เช่น 14"/>
    </div>

    <div class="field">
      <label for="community_backup">Community backup</label>
      <input type="text" id="community_backup" placeholder="เช่น 97"/>
    </div>
  </div>

  <div class="section-title"><span class="dot"></span>อื่น ๆ</div>
  <hr class="line"/>

  <div class="form-grid">
    <div class="field">
      <label for="Customerfullname">Customer full name</label>
      <input type="text" id="Customerfullname" placeholder="เช่น CMI TH_New_Getop(Thailand)"/>
    </div>

    <div class="field">
      <label for="PROXY">PROXY</label>
      <select id="PROXY"></select>
    </div>
  </div>

  <div class="buttons">
    <button class="btn-ghost" type="button" onclick="copyToClipboard()">📋 คัดลอก Config</button>
    <button class="btn-primary" type="button" onclick="generateConfig()">⚙️ สร้าง Config</button>
  </div>

  <div class="output-wrapper">
    <div class="output-header">
      <div class="output-title">ผลลัพธ์ Config</div>
      <div class="output-status" id="outputStatus">รอสร้าง Config...</div>
    </div>
    <pre id="output">ผลลัพธ์จะแสดงที่นี่...</pre>
  </div>
</div>


<script>
  // ============================================================
  // CONFIG GENERATOR - REFACTORED SINGLE FILE VERSION
  // เป้าหมาย: เพิ่มอุปกรณ์ใหม่ง่ายขึ้น โดยแก้หลัก ๆ ที่ DEVICE_PROFILES + template function
  // ============================================================

  // ---------- Static Data ----------
  const PROXY_GROUPS = {
    publicProxy: [
      { value: "", label: "None" },
      { value: "58.82.174.100", label: "PROXY 1" },
      { value: "182.50.80.57",  label: "PROXY 2" },
      { value: "58.82.174.23",  label: "PROXY 3" },
      { value: "182.50.80.27",  label: "PROXY 4" },
      { value: "182.50.80.7",   label: "PROXY 5" },
      { value: "182.50.80.41",  label: "PROXY 6" },
      { value: "58.82.174.4",   label: "PROXY 7" },
      { value: "58.82.174.8",   label: "PROXY 8" },
      { value: "182.50.80.43",  label: "PROXY 9" },
      { value: "58.82.174.10",  label: "PROXY 10" }
    ],
    switchProxy: [
      { value: "", label: "None" },
      { value: "10.20.1.201", label: "PROXY 1" },
      { value: "10.20.1.92",  label: "PROXY 2" },
      { value: "10.20.1.213", label: "PROXY 3" },
      { value: "10.20.1.204", label: "PROXY 4" },
      { value: "10.20.1.115", label: "PROXY 5" },
      { value: "10.20.1.206", label: "PROXY 6" },
      { value: "10.20.1.207", label: "PROXY 7" },
      { value: "10.20.1.208", label: "PROXY 8" },
      { value: "10.20.1.209", label: "PROXY 9" },
      { value: "10.20.1.10",  label: "PROXY 10" }
    ]
  };

  const DEVICE_PROFILES = {
    "huawei-router": {
      label: "AR5710-S (Router)",
      vendor: "huawei",
      role: "router",
      proxyGroup: "publicProxy",
      wanCustomerOffset: 3,
      buildConfig: (ctx) => buildHuaweiRouterConfig(ctx, ctx.hasProtect)
    },
    "huawei-switch": {
      label: "S5335-L10T4X-A-V2 (Switch)",
      vendor: "huawei",
      role: "switch",
      proxyGroup: "switchProxy",
      wanCustomerOffset: 6,
      buildConfig: (ctx) => buildSwitchConfig(ctx, ctx.hasProtect)
    },
    "cisco-4331": {
      label: "Cisco ISR4331 (Router)",
      vendor: "cisco",
      role: "router",
      proxyGroup: "publicProxy",
      wanCustomerOffset: 3,
      buildConfig: (ctx) => buildCiscoConfig(ctx, ctx.hasProtect)
    }
  };

  // ---------- Form / UI ----------
  function getSelectedProfile() {
    const deviceType = document.getElementById("deviceType").value || "huawei-router";
    return DEVICE_PROFILES[deviceType] || DEVICE_PROFILES["huawei-router"];
  }

  function collectFormInput() {
    const ids = [
      "deviceType", "Cxxx", "RT_Name", "VLAN", "LOOPBACK", "Name_main", "Name_Protection",
      "WAN1_IP_NODE", "WAN2_IP_NODE", "WAN1_IP_CustomerSUB1", "WAN2_IP_CustomerSUB2",
      "WAN_IP_Network", "LAN_IP_Network", "community_main", "community_backup",
      "Customerfullname", "PROXY"
    ];

    const input = {};
    ids.forEach(id => {
      input[id] = (document.getElementById(id)?.value || "").trim();
    });

    return {
      deviceType: input.deviceType,
      Cxxx: input.Cxxx,
      RT_Name: input.RT_Name,
      VLAN: input.VLAN,
      LOOPBACK: input.LOOPBACK,
      Name_main_raw: input.Name_main,
      Name_Protection_raw: input.Name_Protection,
      WAN1_IP_NODE_raw: input.WAN1_IP_NODE,
      WAN2_IP_NODE_raw: input.WAN2_IP_NODE,
      WAN1_IP_CustomerSUB1: input.WAN1_IP_CustomerSUB1,
      WAN2_IP_CustomerSUB2: input.WAN2_IP_CustomerSUB2,
      WAN_IP_Network: input.WAN_IP_Network,
      LAN_IP_Network: input.LAN_IP_Network,
      community_main: input.community_main,
      community_backup: input.community_backup,
      Customerfullname: input.Customerfullname,
      PROXY: input.PROXY
    };
  }

  function populateDeviceOptions() {
    const select = document.getElementById("deviceType");
    const current = select.value;
    select.innerHTML = "";

    Object.entries(DEVICE_PROFILES).forEach(([value, profile]) => {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = profile.label;
      select.appendChild(opt);
    });

    if (DEVICE_PROFILES[current]) select.value = current;
  }

  function populateProxyOptions() {
    const profile = getSelectedProfile();
    const select = document.getElementById("PROXY");
    const current = select.value;
    const opts = PROXY_GROUPS[profile.proxyGroup] || PROXY_GROUPS.publicProxy;

    select.innerHTML = "";
    opts.forEach(o => {
      const opt = document.createElement("option");
      opt.value = o.value;
      opt.textContent = o.label + (o.value ? ` (${o.value})` : "");
      select.appendChild(opt);
    });

    if ([...select.options].some(o => o.value === current)) select.value = current;
  }

  function renderOutput(text) {
    document.getElementById("output").textContent = text;
    document.getElementById("outputStatus").textContent = "สร้าง Config แล้ว";
  }

  document.addEventListener("DOMContentLoaded", () => {
    populateDeviceOptions();
    populateProxyOptions();
    document.getElementById("deviceType").addEventListener("change", populateProxyOptions);
  });

  // ---------- Validation ----------
  function validateInput(raw) {
    const required = ["Cxxx", "RT_Name", "VLAN", "LOOPBACK", "Name_main_raw", "WAN1_IP_NODE_raw", "WAN1_IP_CustomerSUB1"];
    const missing = required.filter(k => !raw[k]);

    if (missing.length) {
      return {
        ok: false,
        message: "กรุณากรอกข้อมูลที่จำเป็นให้ครบ: " + missing.join(", ")
      };
    }

    if (raw.VLAN && !/^\d+$/.test(raw.VLAN)) {
      return { ok: false, message: "VLAN ต้องเป็นตัวเลข" };
    }

    return { ok: true, message: "" };
  }

  // ---------- IP / String Helpers ----------
  function parseIpCidr(str) {
    if (!str) return { ip: "", cidr: "" };
    const parts = str.trim().split(/[\/\s]+/);
    return { ip: parts[0] || "", cidr: parts[1] || "" };
  }

  function toCliMask(str) {
    const { ip, cidr } = parseIpCidr(str);
    if (!ip) return "";
    if (!cidr) return ip;
    return `${ip} ${cidr}`;
  }

  function stripSubnet(str) {
    return parseIpCidr(str).ip;
  }

  function cidrToMask(cidr) {
    cidr = Number(cidr);
    if (!Number.isInteger(cidr) || cidr < 0 || cidr > 32) return "";
    const mask = [];
    let bits = cidr;
    for (let i = 0; i < 4; i++) {
      const take = Math.min(8, bits);
      const oct = take === 0 ? 0 : (0xff << (8 - take)) & 0xff;
      mask.push(oct);
      bits -= take;
    }
    return mask.join(".");
  }

  function addToIp(ip, increment) {
    if (!ip) return "";
    const o = ip.split(".").map(Number);
    if (o.length !== 4 || o.some(n => Number.isNaN(n))) return ip;

    let carry = increment;
    for (let i = 3; i >= 0 && carry !== 0; i--) {
      const val = o[i] + carry;
      o[i] = ((val % 256) + 256) % 256;
      carry = Math.floor(val / 256);
    }
    return o.join(".");
  }

  function getGateway(str) {
    if (!str) return "";
    const { ip, cidr } = parseIpCidr(str);
    if (!ip) return "";

    const o = ip.split(".").map(Number);
    if (o.length !== 4 || o.some(n => Number.isNaN(n))) return str.trim();
    if (o[3] < 255) o[3] += 1;

    const gwIp = o.join(".");
    return cidr ? `${gwIp} ${cidr}` : gwIp;
  }

  function normalizeNodeName(raw) {
    if (!raw) return "";
    let name = raw.trim();
    [
      /^CX600_/i,
      /^JT-SW2-CX_/i,
      /^JT-SW1-CX_/i,
      /^JT-M4-/i,
      /^ATN950B_/i,
      /^ATN910C_/i
    ].forEach(re => { name = name.replace(re, ""); });
    return name.replace(/#/g, "");
  }

  function parseNode(raw) {
    if (!raw) return { node: "", iface: "" };
    const p = raw.trim().split(/\s+/);
    return { node: p[0] || "", iface: p[1] || "" };
  }

  function buildDescriptionFromParsed(p) {
    if (!p.node || !p.iface) return "";
    return `[NODE]:TO:[${p.node}]<VIA>[JAS]:[${p.iface}]`;
  }

  function toNodeIface(iface) {
    if (!iface) return "";
    let s = iface.trim();
    s = s.replace(/^10GE/i, "10GigabitEthernet");
    s = s.replace(/^GE/i, "GigabitEthernet");
    return s;
  }

  // ---------- Context Builder ----------
  function buildContext(raw, profile) {
    const ctx = { ...raw };
    const cidTrim = (ctx.Cxxx || "").trim();
    const isP = /^P/i.test(cidTrim);

    ctx.profile = profile;
    ctx.MGMT_VLAN = isP ? "123" : "124";

    const wan1Node = parseIpCidr(ctx.WAN1_IP_NODE_raw);
    const wan2Node = parseIpCidr(ctx.WAN2_IP_NODE_raw);
    ctx.WAN1_NODE_MASK = cidrToMask(wan1Node.cidr);
    ctx.WAN2_NODE_MASK = cidrToMask(wan2Node.cidr);

    ctx.WAN1_IP_CustomerSUB1_cli = toCliMask(ctx.WAN1_IP_CustomerSUB1);
    ctx.WAN2_IP_CustomerSUB2_cli = toCliMask(ctx.WAN2_IP_CustomerSUB2);

    ctx.WAN1_IP_NODE = stripSubnet(ctx.WAN1_IP_NODE_raw);
    ctx.WAN2_IP_NODE = stripSubnet(ctx.WAN2_IP_NODE_raw);
    ctx.WAN1_IP_Customer = stripSubnet(ctx.WAN1_IP_CustomerSUB1);
    ctx.WAN2_IP_Customer = stripSubnet(ctx.WAN2_IP_CustomerSUB2);

    ctx.LAN_IP_Gateway = getGateway(ctx.LAN_IP_Network);

    const wanNet = parseIpCidr(ctx.WAN_IP_Network);
    const wanMask = cidrToMask(wanNet.cidr);
    const offset = profile.wanCustomerOffset ?? 3;

    ctx.Wan_IP_Customer_RT = wanNet.ip ? addToIp(wanNet.ip, offset) : "";
    ctx.WAN_IP_MAIN = wanNet.ip ? addToIp(wanNet.ip, 1) : "";
    ctx.WAN_IP_PROTECTION = wanNet.ip ? addToIp(wanNet.ip, 2) : "";
    ctx.WAN_IP_Mask = wanMask || "";
    ctx.Wan_IP_Customer_RT_withMask = (ctx.Wan_IP_Customer_RT && wanMask) ? `${ctx.Wan_IP_Customer_RT} ${wanMask}` : ctx.Wan_IP_Customer_RT;
    ctx.Wan_IP_Customer_RT_mask = (ctx.Wan_IP_Customer_RT && wanMask) ? `${ctx.Wan_IP_Customer_RT} ${wanMask}` : "";
    ctx.WAN_NET_IP = wanNet.ip || "";
    ctx.WAN_NET_MASK = wanMask || "";
    ctx.WAN_IP_Network_mask = (wanNet.ip && wanMask) ? `${wanNet.ip} ${wanMask}` : "";

    const lanNet = parseIpCidr(ctx.LAN_IP_Network);
    const lanMask = cidrToMask(lanNet.cidr);
    ctx.LAN_NET_IP = lanNet.ip || "";
    ctx.LAN_NET_MASK = lanMask || "";
    ctx.LAN_IP_Network_mask = (lanNet.ip && lanMask) ? `${lanNet.ip} ${lanMask}` : "";

    const lanGateway = parseIpCidr(ctx.LAN_IP_Gateway);
    const lanGwMask = cidrToMask(lanGateway.cidr);
    ctx.LAN_IP_Gateway_mask = (lanGateway.ip && lanGwMask) ? `${lanGateway.ip} ${lanGwMask}` : "";

    const mainParsed = parseNode(ctx.Name_main_raw);
    const protParsed = parseNode(ctx.Name_Protection_raw);
    ctx.hasProtect = !!(ctx.Name_Protection_raw && ctx.WAN2_IP_NODE_raw && ctx.WAN2_IP_CustomerSUB2);

    ctx.Name_main_only = normalizeNodeName(mainParsed.node);
    ctx.Name_Protection_only = normalizeNodeName(protParsed.node);
    ctx.DES1_built = buildDescriptionFromParsed(mainParsed);
    ctx.DES2_built = ctx.hasProtect ? buildDescriptionFromParsed(protParsed) : "";

    return ctx;
  }

  // ---------- Preconfig Builder ----------
  function buildPreconfigNodeSection(ctx) {
    const cid = (ctx.Cxxx || "").trim();
    const rt = (ctx.RT_Name || "").trim();
    const vlanSvc = (ctx.VLAN || "").trim();
    const loop = (ctx.LOOPBACK || "").trim();
    const isPcid = /^P/i.test(cid);

    const mNode = parseNode(ctx.Name_main_raw);
    const pNode = parseNode(ctx.Name_Protection_raw);

    const mNodeName = (mNode.node || "").trim();
    const pNodeName = (pNode.node || "").trim();
    const mIface = toNodeIface(mNode.iface || "");
    const pIface = toNodeIface(pNode.iface || "");

    const mNodeIp = stripSubnet(ctx.WAN1_IP_NODE_raw);
    const mRtIp = stripSubnet(ctx.WAN1_IP_CustomerSUB1);
    const pNodeIp = stripSubnet(ctx.WAN2_IP_NODE_raw);
    const pRtIp = stripSubnet(ctx.WAN2_IP_CustomerSUB2);

    const includeL3vpn = !isPcid;
    const wanNet = parseIpCidr(ctx.WAN_IP_Network);
    const wanMask = cidrToMask(wanNet.cidr);
    const descBase = `:${cid}:${rt}`;

    function l3Block(nodeIf, nodeL3Ip) {
      if (!includeL3vpn) return "";
      if (!vlanSvc || !nodeIf || !nodeL3Ip || !wanMask || !ctx.Wan_IP_Customer_RT) return "";
      return `
#
ip vpn-instance ${vlanSvc}
 description :${cid}:${rt}
 ipv4-family
  route-distinguisher 65423:${vlanSvc}
  apply-label per-route
  vpn-target 65423:65423 export-extcommunity
  vpn-target 65423:65423 import-extcommunity
#
interface ${nodeIf}.${vlanSvc}
 vlan-type dot1q ${vlanSvc}
 mtu 9500
 description :${cid}:${rt}
 ip binding vpn-instance ${vlanSvc}
 ip address ${nodeL3Ip} ${wanMask}
 statistic enable
#
bgp 65423
 ipv4-family vpn-instance ${vlanSvc}
  import-route direct
  peer ${ctx.Wan_IP_Customer_RT} as-number 65001
  peer ${ctx.Wan_IP_Customer_RT} description :${cid}:${rt}
  peer ${ctx.Wan_IP_Customer_RT} ebgp-max-hop 5
  peer ${ctx.Wan_IP_Customer_RT} connect-interface ${nodeIf}.${vlanSvc}
  peer ${ctx.Wan_IP_Customer_RT} bfd enable
  peer ${ctx.Wan_IP_Customer_RT} route-policy rp_customer_l3vpn_in import
  peer ${ctx.Wan_IP_Customer_RT} route-policy rp_customer_l3vpn_out export
  peer ${ctx.Wan_IP_Customer_RT} route-limit 10 80 alert-only
  peer ${ctx.Wan_IP_Customer_RT} advertise-community
#`;
    }

    function jtExtraBlock(nodeName, nodeIf) {
      if (!/^JT/i.test(nodeName || "")) return "";
      if (!vlanSvc || !nodeIf) return "";
      return `
vlan ${vlanSvc}
name "${cid}:${rt}"

interface Eth-Trunk10
port trunk allow-pass vlan ${vlanSvc}

interface ${nodeIf}
 undo negotiation auto
 description :${cid}:${rt}
 port link-type trunk
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan ${ctx.MGMT_VLAN} ${vlanSvc}
`;
    }

    function mgmtBlock(nodeIf, nodeNodeIp, nodeMask, nodeRtIp, nqaId) {
      if (!nodeIf || !nodeNodeIp || !nodeMask || !nodeRtIp || !loop) return "";
      return `
#
interface ${nodeIf}.${ctx.MGMT_VLAN}
 vlan-type dot1q ${ctx.MGMT_VLAN}
 description ${descBase}
 ip binding vpn-instance __dcn_vpn__
 ip address ${nodeNodeIp} ${nodeMask}
 statistic enable
#
nqa test-instance ${cid} ${nqaId}
 test-type icmp
 destination-address ipv4 ${nodeRtIp}
 source-address ipv4 ${nodeNodeIp}
 vpn-instance __dcn_vpn__
 frequency 30
 start now
#
ip route-static vpn-instance __dcn_vpn__ ${loop} 32 ${nodeRtIp} track nqa ${cid} ${nqaId}
#`;
    }

    let out = `===== PRECONFIG NODE =====`;

    if (mNodeName && mIface) {
      out += `
NODE ${mNodeName}
${mgmtBlock(mIface, mNodeIp, ctx.WAN1_NODE_MASK, mRtIp, 1)}
${l3Block(mIface, ctx.WAN_IP_MAIN)}
${jtExtraBlock(mNodeName, mIface)}`.trimEnd();
    }

    if (ctx.hasProtect && pNodeName && pIface) {
      out += `

NODE ${pNodeName}
${mgmtBlock(pIface, pNodeIp, ctx.WAN2_NODE_MASK, pRtIp, 2)}
${l3Block(pIface, ctx.WAN_IP_PROTECTION)}
${jtExtraBlock(pNodeName, pIface)}`.trimEnd();
    }

    out += `

===== END PRECONFIG NODE =====`;
    return out;
  }

  // ---------- Main Flow ----------
  function generateConfig() {
    const raw = collectFormInput();
    const profile = DEVICE_PROFILES[raw.deviceType] || DEVICE_PROFILES["huawei-router"];
    const validation = validateInput(raw);

    if (!validation.ok) {
      document.getElementById("output").textContent = validation.message;
      document.getElementById("outputStatus").textContent = "ข้อมูลยังไม่ครบ";
      return;
    }

    const ctx = buildContext(raw, profile);
    const preconfigNodeText = buildPreconfigNodeSection(ctx);
    const deviceConfig = profile.buildConfig(ctx);
    renderOutput(`${preconfigNodeText}\n\n${deviceConfig}`.trim());
  }

  neighbor ${formData.WAN_IP_MAIN} activate
  neighbor ${formData.WAN_IP_MAIN} send-community
  neighbor ${formData.WAN_IP_MAIN} soft-reconfiguration inbound
  neighbor ${formData.WAN_IP_MAIN} route-map rp_peer_node_main_in in
  neighbor ${formData.WAN_IP_MAIN} route-map rp_peer_node_main_out out${hasProtect ? `
  neighbor ${formData.WAN_IP_PROTECTION} activate
  neighbor ${formData.WAN_IP_PROTECTION} send-community
  neighbor ${formData.WAN_IP_PROTECTION} soft-reconfiguration inbound
  neighbor ${formData.WAN_IP_PROTECTION} route-map rp_peer_node_protect_out out` : ""}
 exit-address-family
exit

ip forward-protocol nd
ip bgp-community new-format
no ip http server
no ip http secure-server
ip tacacs source-interface Gi0/0/0

ip route ${formData.LAN_IP_Network_mask} NULL 0

ip prefix-list pf_${formData.Cxxx} seq 5 permit ${wanPrefix}
ip prefix-list pf_${formData.Cxxx} seq 10 permit ${lanPrefix}

access-list 30 remark jastel nms
access-list 30 permit 10.0.0.0 0.255.255.255
access-list 30 permit 58.82.174.0 0.0.0.255 
access-list 30 permit 169.254.0.0 0.0.255.255 
access-list 30 permit 172.16.0.0 0.15.255.255 
access-list 30 permit 182.50.80.0 0.0.0.127 
access-list 30 permit 192.168.0.0 0.0.255.255
access-list 30 permit 58.82.174.240 0.0.0.15

snmp-server community +jastel+ RO 30
snmp-server trap-source gigabitEthernet 0/0/0
snmp-server contact "${formData.Customerfullname}"                              						
snmp-server host ${proxyHost} version 2c +jastel+											 
snmp-server enable traps

route-map rp_peer_node_main_in permit 10
 set local-preference 150
exit

route-map rp_peer_node_main_out permit 10
 match ip address prefix-list pf_${formData.Cxxx}
 set community 65423:${formData.community_main}
exit${hasProtect ? `

route-map rp_peer_node_protect_out permit 10
 match ip address prefix-list pf_${formData.Cxxx}
 set metric 50
 set community 65423:${formData.community_backup}
exit` : ""}

tacacs server JASTELACS
 address ipv4 10.10.144.250
 key 7 004F1907174F0E0A44
exit

control-plane
exit

line con 0
line aux 0
line vty 0 4
 access-class 30 in
 transport input all
exit

ntp clock-period 17180182
ntp server WAN

kron policy-list SAVE-CONFIG
exit 

kron occurrence DAILY-SAVE at 0:01 recurring
 policy-list SAVE-CONFIG
end`;
  }

  function copyToClipboard() {
    let outputText = document.getElementById("output").textContent;
    if (!outputText || outputText === "ผลลัพธ์จะแสดงที่นี่...") {
      alert("ยังไม่มี Config ให้คัดลอก");
      return;
    }
    navigator.clipboard.writeText(outputText).then(() => {
      alert("Config ถูกคัดลอกไปยังคลิปบอร์ดแล้ว!");
    }).catch(err => {
      console.error("ไม่สามารถคัดลอกข้อความได้", err);
      alert("ไม่สามารถคัดลอกข้อความได้");
    });
  }
</script>
